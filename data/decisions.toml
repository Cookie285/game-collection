[[decision]]
id = "d2d-edge-cases"
question = "Disc-to-Digital edge cases: lending, second account on the same console, offline, account recovery, family sharing"
area = "xbox"
kind = "research"
rules = ["disc-to-digital"]
context = "Lending: license follows the disc, not the original claimant — if account A claims digitally then lends the disc to account B, B can claim it too and A loses disc-based access. Family/shared-console members get access via the sharing account like any digital title. Nothing found yet on offline behaviour or account-recovery edge cases. Program still Insider-only (started 31 Aug 2026); official docs may still change before GA (checked 2026-09-28). · GA 29 Sep 2026: the licence follows the disc — if another account claims it, yours is revoked. Series S / all-digital consoles can't claim. Offline second-account behaviour only suggested by one FAQ (unconfirmed); family sharing / account recovery still not documented. (checked 2026-10-01)"

