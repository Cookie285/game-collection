[[decision]]
id = "gta6-preorder"
question = "GTA VI: pre-order or not?"
area = "playstation"
due = "2026-11-19"
context = "Continues the GTA run (IV/V PS3, LCS/VCS PSP). No PC version at launch. · Date reaffirmed by Take-Two in Aug 2026 (checked 2026-09-28) · Still 19 Nov 2026 — Take-Two reaffirmed in Aug and at the Sep 2026 shareholder meeting; pre-orders open (Standard / Ultimate), pre-load 12 Nov. (checked 2026-10-01) · The boxed PS5 / Xbox edition is code-in-a-box — no disc, no map; redeemable from 12 Nov for pre-loading (Rockstar, Jun 2026). A December disc release is only a rumour that Take-Two denied (checked 2026-10-01) · Re-confirmed: Rockstar confirmed on 24 Jun 2026 that the boxed copy is only a single-use download code (Kotaku, The Shortcut); boxed Standard Edition on PS5 and Xbox Series X|S at the same price as digital. Because it's a licence either way, the platform decides where it lives on: the user doesn't plan to buy the next PlayStation (next-playstation-no), while Microsoft says the next Xbox is fully compatible with the existing Xbox library. Disc-to-Digital doesn't apply (no disc) (checked 2026-10-01)"
rules = ["ps-exclusives-and-disc-worthy", "physical-first", "code-in-box"]
targets = ["Grand Theft Auto VI"]
recommendation = "No disc exists on either console, so you are choosing a digital licence, not a shelf copy. If you want it at launch: take the Xbox Series X|S version (sealed box code or Xbox Store, whichever is cheaper) — Microsoft says the next Xbox runs the existing library, while a PSN licence stays behind if you skip the next PlayStation as planned. Otherwise wait: a later disc edition, a PC version or a next-gen re-release (GTA V got all three) may still come."
sources = ["https://kotaku.com/physical-copies-of-gta-6-will-just-be-a-code-in-a-box-with-no-disc-at-launch-2000709919", "https://www.theshortcut.com/p/gta-6-physical-copies-are-just-a-download-code-in-a-box-rockstar-confirms", "https://www.resetera.com/threads/xbox-amd-powering-the-next-generation-of-xbox-fully-compatible-with-the-existing-xbox-game-library-not-tied-to-a-single-store.1220895/"]
