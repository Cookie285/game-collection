context = "Asked in chat 2026-10-02: where does the Ace Combat series fit best? · Owned: Assault Horizon (PS3); Ace Combat 7 is already planned as a Switch cart. Facts: the classic games are PlayStation-only — 04 (EU 'Distant Thunder'), 5 (EU 'Squadron Leader'), Zero on PS2, never re-released on disc (5's PS4 port was only a 2019 pre-order bonus). 6 is an Xbox 360 exclusive, backward compatible since 2019, not sold digitally, DLC delisted. 7: Switch cart has the full Deluxe game on the cart; only PS4 has the PS VR missions. 8: Wings of Theve out 2 Oct 2026 on PS5, Xbox Series X|S, PC (no Switch), on disc for both consoles; Bandai Namco discs don't convert via Disc-to-Digital yet. PSP entries (X, X2) fall under 'handhelds not collected'. (checked 2026-10-02)"
recommendation = "Split by era, as your rules already do: classic 04 / 5 / Zero → PS2 PAL discs (they're PlayStation exclusives); 6 → Xbox 360 disc (exclusive, BC, delisted digitally); 7 → keep the Switch cart plan; skip the PSP games. For Ace Combat 8 I'd take the Xbox Series X disc: you don't plan a next PlayStation, while the next Xbox runs the current library — and if Bandai Namco joins Disc-to-Digital the disc gains a digital licence. PS5 is the alternative if you want the modern games next to the PS2 trilogy."
rules = ["pal-only-ps1-ps2", "handhelds-not-collected", "bc-digital-unless-delisted", "switch-first", "no-next-playstation", "ps-exclusives-and-disc-worthy"]
