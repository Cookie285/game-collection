# Open questions and decisions as data — replaces the hand-written OPEN-QUESTIONS.md (now generated from this file).
#
# [[decision]] fields
#   id              stable id (kebab-case)
#   question        the question, one line
#   area            all · nintendo · pc · playstation · xbox
#   kind            decision (default) · research (find something out) · clz-fix (fix data in CLZ, then re-import)
#   status          open (default) · decided · dropped
#   due             optional date (release date / deadline), YYYY-MM-DD
#   context         background, one paragraph
#   recommendation  the current suggestion, if any
#   rules           rule ids from data/rules.toml that this question is about
#   targets         buy-plan titles this question decides (matched like CLZ titles; also finds series entries)
#   match           optional patterns like in rules.toml, to link more targets automatically
#   [[decision.option]]  label, pros = [...], cons = [...]
# When you decide: set status = "decided", decided = "YYYY-MM-DD", outcome = "what and why",
# then update the targets' state / platforms / plan (and rules.toml if it sets a precedent).

# ---------------------------------------------------------------- Game-Key Card vs PS5 disc
[[decision]]
id = "kh-collection-platform"
question = "Kingdom Hearts Collection [I–III]: PS5 disc or Switch 2 Game-Key Card?"
area = "playstation"
due = "2026-10-08"
context = "Switch 2 version is a Game-Key Card with a ~131 GB download; the PS5 version is a full-install disc. One disc = 1.5+2.5 ReMIX, 2.8 and KH III + Re Mind. KH III (PS4) is already owned."
recommendation = "PS5 — the JRPG rule says Switch, but the Switch 2 box is effectively a download voucher for a huge game."
rules = ["gkc-not-physical", "switch-first", "one-copy-newest-gen"]
targets = ["Kingdom Hearts Collection [I–III]"]
[[decision.option]]
label = "PS5 disc"
pros = ["Full install on the disc", "Real physical copy"]
cons = ["Makes KH III (PS4) surplus"]
[[decision.option]]
label = "Switch 2 Game-Key Card"
pros = ["JRPG rule points to Switch"]
cons = ["~131 GB download — the box is only a licence"]

