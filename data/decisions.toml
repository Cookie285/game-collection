# Open questions and decisions as data — replaces the hand-written OPEN-QUESTIONS.md (now generated from this file).
#
# [[decision]] fields
#   id              stable id (kebab-case)
#   question        the question, one line
#   area            all · nintendo · pc · playstation · xbox
#   kind            decision (default) · research (find something out) · clz-fix (fix data in CLZ, then re-import)
#   status          open (default) · decided · dropped
#   due             optional date (release date / deadline), YYYY-MM-DD
#   context         background, one paragraph
#   recommendation  the current suggestion, if any
#   rules           rule ids from data/rules.toml that this question is about
#   targets         buy-plan titles this question decides (matched like CLZ titles; also finds series entries)
#   match           optional patterns like in rules.toml, to link more targets automatically
#   asked, issue    set by "❓ Ask a question" (issue form → Action → gamecoll.py ask): date asked, GitHub issue number
#   sources         optional list of URLs backing the context / recommendation
#   [[decision.option]]  label, pros = [...], cons = [...]
# When you decide: set status = "decided", decided = "YYYY-MM-DD", outcome = "what and why",
# then update the targets' state / platforms / plan (and rules.toml if it sets a precedent).

# ---------------------------------------------------------------- Game-Key Card vs PS5 disc
[[decision]]
id = "kh-collection-platform"
question = "Kingdom Hearts Collection [I–III]: PS5 disc or Switch 2 Game-Key Card?"
area = "playstation"
due = "2026-10-08"
context = "Switch 2 version is a Game-Key Card with a ~131 GB download; the PS5 version is a full-install disc. One disc = 1.5+2.5 ReMIX, 2.8 and KH III + Re Mind. KH III (PS4) is already owned. · Also releasing on Xbox Series X|S, but digital only — the physical choice stays PS5 disc vs Switch 2 Game-Key Card (checked 2026-09-28) · Still 8 Oct. The PS5 disc is listed at EU retail, but pre-order coverage / Square Enix's store say physical needs an additional data download — the PS5 disc may not be a full install. Switch 2 = Game-Key Card (~131 GB). (Separately, the old Switch 1 cloud versions were delisted; servers off Jun 2027 — not relevant to the Switch 2 / PS5 choice.) (checked 2026-10-01)"
recommendation = "PS5 — still the more physical option (a disc with game data on it, playable without the eShop licence check), but likely not a full install; the Switch 2 box is a pure download licence."
rules = ["gkc-not-physical", "switch-first", "one-copy-newest-gen"]
targets = ["Kingdom Hearts Collection [I–III]"]
[[decision.option]]
label = "PS5 disc"
pros = ["Real physical copy (disc with game data)"]
cons = ["Makes KH III (PS4) surplus", "Physical version reportedly needs an additional data download — maybe not a full install (checked 2026-10-01)"]
[[decision.option]]
label = "Switch 2 Game-Key Card"
pros = ["JRPG rule points to Switch"]
cons = ["~131 GB download — the box is only a licence"]

