# Hand fixes for IGDB covers (data/covers.json is generated by `python3 scripts/gamecoll.py covers`).
# The image id is the last part of an IGDB image URL: …/t_cover_big/co1r7f.jpg → "co1r7f".
#
# [[cover]]
# title = "Halo 3"
# platform = "Xbox 360"      # optional — without it the fix applies to every platform
# image = "co1xhb"           # use this cover
#
# [[cover]]
# title = "Some Game"
# none = true                # never show a cover (e.g. the match is wrong and there is no good one)
