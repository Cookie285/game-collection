name: Web frontend

# Builds site/data.json from the repo data and publishes site/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "site/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["CLZ import"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/gamecoll.py export site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
