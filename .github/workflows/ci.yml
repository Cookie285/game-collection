name: CI

# Runs on every pull request (and on main): data files must load and link up, the scripts and the web app must
# still work. A red ✗ on a PR means "don't merge yet".
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # oldest supported version (tomllib)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Data checks (TOML, rule ids, decisions, versions)
        run: python3 scripts/gamecoll.py check
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the web app data
        run: python3 scripts/gamecoll.py export "$RUNNER_TEMP/data.json"
      - name: JavaScript syntax
        run: node --check site/app.js && node --check site/theme.js
      - name: Rules engine tests
        run: node tests/engine.test.js
